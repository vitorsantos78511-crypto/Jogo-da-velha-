<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>Jogo da Velha</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#eef4ff;color:#172033;font-family:system-ui,Arial,sans-serif}.app{max-width:500px;margin:auto}.panel{background:#fff;border:1px solid #d5deed;border-radius:22px;padding:18px;box-shadow:0 8px 28px #1b376515}.hidden{display:none!important}.hero{text-align:center;padding:8px 0 20px}.hero .emoji{font-size:58px}.hero h1{font-size:30px;margin:8px 0}.muted{color:#65728a}label{font-weight:750;display:grid;gap:8px;margin-bottom:16px}.field{width:100%;padding:15px;border:2px solid #d5deed;border-radius:12px;font-size:17px;color:#172033;background:#fff}.btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:#2563eb;color:white;font-size:17px;font-weight:800;cursor:pointer}.secondary{padding:11px 14px;border:1px solid #cbd5e1;border-radius:12px;background:white;color:#172033;font-weight:700;cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}.scores{display:flex;gap:9px}.score{flex:1;min-width:0;text-align:center;padding:12px 5px;border:2px solid #d5deed;border-radius:14px;overflow-wrap:anywhere}.score strong{display:block;font-size:32px}.score small{font-size:11px;color:#65728a}.status{text-align:center;font-size:23px;font-weight:900;margin:22px 0 4px}.help{text-align:center;color:#65728a;font-size:14px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;width:100%;max-width:410px;margin:18px auto}.cell{aspect-ratio:1;min-width:0;border:3px solid #aab8cc;border-radius:15px;background:#f7faff;font-size:clamp(48px,15vw,82px);font-weight:950;line-height:1;cursor:pointer;color:#172033}.cell.x{color:#1675ee;border-color:#1675ee;background:#eaf3ff}.cell.o{color:#e34c46;border-color:#e34c46;background:#fff0ef}.cell.win{box-shadow:inset 0 0 0 4px #20a568;background:#d9fbe8}.foot{text-align:center;color:#65728a;font-size:12px;margin-top:14px}
</style></head><body><main class="app"><section id="home" class="panel"><div class="hero"><div class="emoji">❌ ⭕</div><h1>Jogo da Velha</h1><p class="muted">Quem vai ganhar?</p></div><form id="form"><label>🔵 Jogador 1 — X<input id="xname" class="field" maxlength="24" placeholder="Nome do jogador 1" required></label><label>🔴 Jogador 2 — O<input id="oname" class="field" maxlength="24" placeholder="Nome do jogador 2" required></label><button class="btn" type="submit">▶ Começar o jogo</button></form></section><section id="game" class="hidden"><div class="top"><button id="back" class="secondary">← Início</button><span class="muted" style="font-size:12px">2 JOGADORES</span></div><div class="panel"><div class="scores"><div id="sx" class="score"><span style="color:#1675ee;font-weight:900">❌ X</span><div id="nx">Jogador 1</div><strong id="px">0</strong><small>VITÓRIAS</small></div><div id="so" class="score"><span style="color:#e34c46;font-weight:900">⭕ O</span><div id="no">Jogador 2</div><strong id="po">0</strong><small>VITÓRIAS</small></div></div><div id="status" class="status" aria-live="polite">Vez do jogador 1</div><div id="help" class="help">Toque em uma casa para jogar</div><div id="board" class="board" aria-label="Tabuleiro"></div><button id="again" class="btn">🔄 Jogar novamente</button><button id="zero" class="secondary" style="width:100%;margin-top:9px">Zerar placar</button></div><p class="foot">Jogo da Velha • feito para jogar junto ❤️</p></section></main><script>
(()=>{const $=id=>document.getElementById(id);let names={X:'Jogador 1',O:'Jogador 2'},points={X:0,O:0},cells=Array(9).fill(''),turn='X',done=false;const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function status(a,b){$('status').textContent=a;$('help').textContent=b||''}function draw(){$('nx').textContent=names.X;$('no').textContent=names.O;$('px').textContent=points.X;$('po').textContent=points.O;$('sx').style.background=turn==='X'&&!done?'#eaf3ff':'white';$('so').style.background=turn==='O'&&!done?'#fff0ef':'white';$('board').innerHTML='';cells.forEach((v,i)=>{let b=document.createElement('button');b.type='button';b.className='cell'+(v==='X'?' x':v==='O'?' o':'');b.textContent=v||'';b.disabled=!!v||done;b.setAttribute('aria-label','Casa '+(i+1)+(v?' '+v:' vazia'));if(lines.some(l=>l.includes(i)&&l.every(n=>cells[n]===v)&&v))b.classList.add('win');b.addEventListener('click',()=>move(i));$('board').appendChild(b)})}function move(i){if(done||cells[i])return;cells[i]=turn;if(lines.some(l=>l.every(n=>cells[n]===turn))){done=true;points[turn]++;status('🏆 '+names[turn]+' venceu!','Parabéns! Jogue novamente para outra partida.')}else if(cells.every(Boolean)){done=true;status('🤝 Deu empate!','Tentem outra vez!')}else{turn=turn==='X'?'O':'X';status('Vez de '+names[turn],turn==='X'?'🔵 X é o próximo.':'🔴 O é o próximo.')}draw()}function reset(){cells=Array(9).fill('');turn='X';done=false;status('Vez de '+names.X,'🔵 X começa. Toque em uma casa.');draw()}$('form').addEventListener('submit',e=>{e.preventDefault();names.X=$('xname').value.trim()||'Jogador 1';names.O=$('oname').value.trim()||'Jogador 2';if(names.X.toLocaleLowerCase()===names.O.toLocaleLowerCase()){alert('Escolham nomes diferentes para os jogadores.');return}points={X:0,O:0};$('home').classList.add('hidden');$('game').classList.remove('hidden');reset()});$('again').addEventListener('click',reset);$('zero').addEventListener('click',()=>{points={X:0,O:0};reset();status('Placar zerado!','Nova partida: '+names.X+' começa.')});$('back').addEventListener('click',()=>{$('game').classList.add('hidden');$('home').classList.remove('hidden')})})();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script></body></html>
